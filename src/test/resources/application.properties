# Tests use isolated, generated keys unless a test supplies its own keypair.
jwt.allow-ephemeral-keys=true
spring.profiles.active=test
spring.mail.username=identity@example.com
# Public test-only key. Deployments must supply a separate random, persistent secret.
app.recovery.token-key=MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
app.recovery.worker-enabled=false
