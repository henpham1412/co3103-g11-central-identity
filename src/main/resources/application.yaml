spring:
  application:
    name: co3103-g11-central-identity
  task:
    execution:
      pool:
        core-size: 8
        max-size: 8
        queue-capacity: 100
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.ssl.checkserveridentity: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
      mail.debug: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/central_identity_dev}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

auth:
  login:
    max-failed-attempts: ${AUTH_LOGIN_MAX_FAILED_ATTEMPTS:5}
    lockout-duration: ${AUTH_LOGIN_LOCKOUT_DURATION:15m}

jwt:
  allow-ephemeral-keys: ${JWT_ALLOW_EPHEMERAL_KEYS:false}
  issuer: ${JWT_ISSUER:http://localhost:8080}
  private-key: ${JWT_PRIVATE_KEY:}
  public-key: ${JWT_PUBLIC_KEY:}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

server:
  port: ${SERVER_PORT:8080}

