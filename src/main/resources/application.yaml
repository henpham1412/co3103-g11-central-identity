spring:
  application:
    name: co3103-g11-central-identity
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/central_identity_dev}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

