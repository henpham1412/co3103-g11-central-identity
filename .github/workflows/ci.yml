name: Central Identity CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Build, test, and validate migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: central_identity_dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d central_identity_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_URL: jdbc:postgresql://localhost:5432/central_identity_dev
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Show Java version
        run: java --version

      - name: Configure PostgreSQL privacy and capture server logs
        run: |
          container="${{ job.services.postgres.id }}"
          docker exec -i "$container" psql -X -v ON_ERROR_STOP=1 -U "$DB_USERNAME" -d central_identity_dev < scripts/postgresql-test-logging.sql
          docker restart "$container"
          for attempt in $(seq 1 30); do
            if docker exec "$container" pg_isready -U "$DB_USERNAME" -d central_identity_dev; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Verify PostgreSQL 18.6 baseline
        run: |
          version=$(docker exec "${{ job.services.postgres.id }}" psql -XAt -v ON_ERROR_STOP=1 -U "$DB_USERNAME" -d central_identity_dev -c 'SHOW server_version_num')
          echo "PostgreSQL server_version_num: $version"
          test "$version" = "180006"

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Run Maven build and tests
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
